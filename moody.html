<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moody &amp; Surreal | Nelly Shemshenovi Photography</title>
    <meta name="description" content="Moody & Surreal collection by Nelly Shemshenovi. Ethereal nocturnal dreamscapes and surreal botanical compositions.">
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-R861KGZXWW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-R861KGZXWW');

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
</head>
<body class="viewer-page">

    <!-- Top Navigation Bar -->
    <header class="viewer-header-bar">
        <a href="collections.html" class="viewer-back-link">&larr; Back to Collections</a>
        <div class="viewer-title-group">
            <h2>Moody &amp; Surreal</h2>
            <span class="viewer-counter" id="viewer-counter">01 / 08</span>
        </div>
        <button class="viewer-close-btn" onclick="window.location.href='collections.html'" title="Close Viewer">&times;</button>
    </header>

    <!-- Main Cinematic Viewer -->
    <div class="viewer-main-container">
        
        <!-- Center Stage for Large Image -->
        <main class="viewer-stage">
            <button class="viewer-nav-btn viewer-nav-prev" onclick="changeSlide(-1)" aria-label="Previous Image">&#10094;</button>
            
            <div class="viewer-stage-img-wrap">
                <img id="main-image" class="viewer-main-img" src="" alt="">
            </div>
            
            <div id="image-caption" class="viewer-caption">Moody &amp; Surreal Still</div>

            <button class="viewer-nav-btn viewer-nav-next" onclick="changeSlide(1)" aria-label="Next Image">&#10095;</button>
        </main>

        <!-- Thumbnails Sidebar (adapts to bottom carousel on mobile) -->
        <aside class="viewer-thumbnails-panel" id="sidebar-thumbnails">
            <!-- Thumbnails injected via JS -->
        </aside>

    </div>

    <script>
        const images = [
            { src: "images/painting25.webp", title: "Azure Serenity: Midsummer Dream &bull; Surreal Blooms" },
            { src: "images/painting1.webp", title: "Dreams in Pastel Blue &bull; Floating Atmosphere" },
            { src: "images/painting2.webp", title: "Blue Abyssal &bull; Conceptual Horizon" },
            { src: "images/painting3.webp", title: "Gloom &amp; Glare &bull; Approaching Storm" },
            { src: "images/painting17.webp", title: "Midnight Blooms &bull; Study in Shadows" },
            { src: "images/painting10.webp", title: "Violet Reflections &bull; Celestial Mysticism" },
            { src: "images/painting20.webp", title: "Gothic Botanical &bull; Twilight Manipulation" },
            { src: "images/painting31.webp", title: "Nocturnal Iris &bull; Cinematic Shadows" },
            { src: "images/painting38.webp", title: "Enchanted Woodland Decay" },
            { src: "images/painting42.webp", title: "Space of Waiting" },
            { src: "images/painting44.webp", title: "Urban Traces" },
        ];

        let currentIndex = 0;

        const mainImage = document.getElementById("main-image");
        const imageCaption = document.getElementById("image-caption");
        const viewerCounter = document.getElementById("viewer-counter");
        const sidebarThumbnails = document.getElementById("sidebar-thumbnails");

        function initLightbox() {
            sidebarThumbnails.innerHTML = "";
            images.forEach((img, index) => {
                const thumb = document.createElement("div");
                thumb.className = `viewer-thumb ${index === currentIndex ? 'active' : ''}`;
                thumb.innerHTML = `<img src="${img.src}" alt="${img.title}" loading="lazy">`;
                thumb.onclick = () => {
                    currentIndex = index;
                    updateLightbox();
                };
                sidebarThumbnails.appendChild(thumb);
            });
            updateLightbox();
        }

        function updateLightbox() {
            mainImage.style.opacity = '0.3';
            setTimeout(() => {
                mainImage.src = images[currentIndex].src;
                imageCaption.innerHTML = images[currentIndex].title;
                const paddedIndex = String(currentIndex + 1).padStart(2, '0');
                const paddedTotal = String(images.length).padStart(2, '0');
                viewerCounter.innerText = `${paddedIndex} / ${paddedTotal}`;
                mainImage.style.opacity = '1';
            }, 120);

            const thumbs = sidebarThumbnails.children;
            for (let i = 0; i < thumbs.length; i++) {
                if (i === currentIndex) {
                    thumbs[i].classList.add("active");
                    thumbs[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    thumbs[i].classList.remove("active");
                }
            }
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            } else if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            updateLightbox();
        }

        // Keyboard navigation
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") changeSlide(-1);
            if (e.key === "ArrowRight") changeSlide(1);
            if (e.key === "Escape") window.location.href = 'collections.html';
        });

        // Touch Swipe Navigation for Mobile
        let touchStartX = 0;
        let touchEndX = 0;

        document.querySelector('.viewer-stage').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.querySelector('.viewer-stage').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) {
                changeSlide(1);
            } else if (touchEndX - touchStartX > 50) {
                changeSlide(-1);
            }
        }, { passive: true });

        window.onload = initLightbox;
    </script>
</body>
</html>
